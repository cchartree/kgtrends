name: Build and Deploy Metrics Charts

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs automatically every 30 minutes
  workflow_dispatch:         # Allows manual button trigger from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas openpyxl plotly google-api-python-client google-auth

      - name: Check and Download from Google Drive
        id: gdrive_check
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: python sync_gdrive.py

      - name: Commit and Push if Updated
        if: steps.gdrive_check.outputs.has_changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.xlsx"
          git commit -m "Auto-update Excel file from Google Drive"
          git push

      - name: Generate HTML Charts
        if: steps.gdrive_check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        run: python generate_charts.py

      - name: Upload Page Artifact
        if: steps.gdrive_check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        if: steps.gdrive_check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4
